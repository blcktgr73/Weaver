name: Release

# Pushing a tag such as v0.0.3 builds the VSIX and the weaver tool and attaches both to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the extension version
        run: |
          version=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Bundle the weaver tool and run it once before it is attached
        run: |
          npm run package:cli
          node dist/weaver.js --help
      - name: Create the release and attach the VSIX and the weaver tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/weaver-*.vsix dist/weaver.js \
            --title "Weaver ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --prerelease
